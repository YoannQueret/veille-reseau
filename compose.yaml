services:
  veille:
    build: .
    environment:
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - type: bind
        source: ./data
        target: /data
        bind:
          create_host_path: false
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
